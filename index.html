<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mandi Market – Shop local vendors online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f6ec;
        --surface: #fff;
        --ink: #1d2a22;
        --muted: #55645a;
        --line: #d9e2d0;
        --red: #c8372d;
        --sun: #f2b632;
        --leaf: #2f6b45;
        --tile: #e7efdd;
        --head: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
        --body: "Figtree", "Segoe UI", Arial, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121a15;
          --surface: #1b2620;
          --ink: #eef3e9;
          --muted: #a5b4a9;
          --line: #2d3b32;
          --red: #e2553f;
          --leaf: #6fbf8a;
          --tile: #243229;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #121a15;
        --surface: #1b2620;
        --ink: #eef3e9;
        --muted: #a5b4a9;
        --line: #2d3b32;
        --red: #e2553f;
        --leaf: #6fbf8a;
        --tile: #243229;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 1rem/1.6 var(--body);
      }
      h1,
      h2,
      h3 {
        font-family: var(--head);
        line-height: 1.1;
        margin: 0;
      }
      :focus-visible {
        outline: 3px solid var(--sun);
        outline-offset: 2px;
      }
      .wrap {
        width: min(1120px, 100% - 2rem);
        margin-inline: auto;
      }
      .topbar {
        background: var(--ink);
        color: var(--bg);
        font-size: 0.875rem;
        text-align: center;
        padding: 0.4rem 1rem;
      }
      header.site {
        background: var(--surface);
        position: sticky;
        top: 0;
        z-index: 5;
        border-bottom: 6px solid var(--red);
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 0.6rem 1rem;
        padding: 0.7rem 0;
        flex-wrap: wrap;
      }
      .logo {
        font: 800 1.5rem var(--head);
        color: var(--red);
        margin-right: auto;
        background: 0;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      .tab {
        background: 0;
        border: 0;
        font: 500 1rem var(--body);
        color: var(--muted);
        cursor: pointer;
        padding: 0.3rem 0.2rem;
        border-bottom: 3px solid transparent;
      }
      .tab:hover {
        color: var(--ink);
      }
      .tab.on {
        color: var(--ink);
        border-color: var(--red);
      }
      select,
      input,
      textarea {
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 0.5rem 0.7rem;
        max-width: 100%;
      }
      .btn {
        display: inline-block;
        border: 0;
        border-radius: 10px;
        background: var(--red);
        color: #fff;
        font: 600 0.95rem var(--body);
        padding: 0.55rem 1rem;
        cursor: pointer;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.alt {
        background: transparent;
        color: var(--ink);
        border: 2px solid var(--ink);
      }
      .btn.sm {
        padding: 0.25rem 0.6rem;
        font-size: 0.85rem;
      }
      .pill {
        background: var(--ink);
        color: var(--bg);
        border-radius: 999px;
        padding: 0.4rem 0.9rem;
        border: 0;
        font: 600 0.95rem var(--body);
        cursor: pointer;
      }
      .pill b {
        background: var(--sun);
        color: #1d2a22;
        border-radius: 999px;
        padding: 0 0.5rem;
        margin-left: 0.3rem;
      }
      .hero {
        padding: 2.5rem 0 1rem;
      }
      .hero h1 {
        font-size: clamp(2rem, 5vw, 3.6rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        max-width: 18ch;
      }
      .hero p {
        color: var(--muted);
        max-width: 52ch;
        margin: 0.8rem 0 0;
        font-size: 1.1rem;
      }
      .filters {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin: 1.5rem 0 1.2rem;
      }
      .filters input {
        flex: 1;
        min-width: 200px;
      }
      section {
        padding: 1.5rem 0 2.5rem;
      }
      h2.t {
        font-size: clamp(1.5rem, 3vw, 2.1rem);
        margin: 0 0 1rem;
        letter-spacing: -0.02em;
      }
      .grid {
        display: grid;
        gap: 1rem;
      }
      .products {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
      .vendors {
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .vendor {
        padding: 1rem;
      }
      .vendor .top {
        display: flex;
        gap: 0.7rem;
        align-items: center;
      }
      .avatar {
        width: 3rem;
        height: 3rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        background: var(--tile);
      }
      .meta {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .pimg {
        aspect-ratio: 4/3;
        display: grid;
        place-items: center;
        font-size: 3.6rem;
        background: var(--tile);
      }
      .pbody {
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        flex: 1;
      }
      .pbody h3 {
        font-size: 1.05rem;
      }
      .price {
        font: 700 1.25rem var(--head);
      }
      .price s {
        font: 400 0.9rem var(--body);
        color: var(--muted);
        margin-left: 0.4rem;
      }
      .badge {
        display: inline-block;
        align-self: flex-start;
        background: var(--red);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: 6px;
        padding: 0.05rem 0.5rem;
        margin-right: 0.3rem;
      }
      .stock {
        font-size: 0.85rem;
        color: var(--leaf);
        font-weight: 600;
      }
      .stock.low {
        color: var(--red);
      }
      .row2 {
        display: flex;
        gap: 0.4rem;
        margin-top: auto;
        padding-top: 0.5rem;
      }
      .row2 .btn {
        flex: 1;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 1.1rem;
        margin-bottom: 1rem;
      }
      .panel h3 {
        font-size: 1.2rem;
        margin-bottom: 0.7rem;
      }
      .frm {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 0.6rem;
        align-items: end;
      }
      .frm label {
        display: grid;
        gap: 0.2rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.5rem 0.4rem;
        border-bottom: 1px dashed var(--line);
        vertical-align: middle;
      }
      .scroll {
        overflow-x: auto;
      }
      td input {
        width: 5.5rem;
        padding: 0.25rem 0.4rem;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.8rem;
        margin-bottom: 1rem;
      }
      .stat {
        background: var(--tile);
        border-radius: 14px;
        padding: 0.9rem;
      }
      .stat b {
        display: block;
        font: 700 1.6rem var(--head);
      }
      .track {
        display: flex;
        gap: 0.3rem;
        margin: 0.6rem 0;
        flex-wrap: wrap;
      }
      .track span {
        font-size: 0.8rem;
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        background: var(--tile);
        color: var(--muted);
      }
      .track span.d {
        background: var(--leaf);
        color: #fff;
      }
      .tagst {
        font-size: 0.8rem;
        font-weight: 600;
        border-radius: 6px;
        padding: 0.05rem 0.5rem;
        background: var(--sun);
        color: #1d2a22;
      }
      .tagst.ok {
        background: var(--leaf);
        color: #fff;
      }
      .tagst.no {
        background: var(--red);
        color: #fff;
      }
      .empty {
        color: var(--muted);
        padding: 1rem 0;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(400px, 100%);
        background: var(--surface);
        border-left: 2px solid var(--ink);
        z-index: 20;
        display: flex;
        flex-direction: column;
        padding: calc(1rem + env(safe-area-inset-top, 0px)) 1.1rem
          calc(1rem + env(safe-area-inset-bottom, 0px));
        transform: translateX(105%);
        transition: transform 0.25s;
        overflow: auto;
      }
      .drawer.open {
        transform: none;
      }
      .drawer header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.6rem;
      }
      .drawer ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .drawer li {
        display: flex;
        justify-content: space-between;
        gap: 0.6rem;
        padding: 0.6rem 0;
        border-bottom: 1px dashed var(--line);
      }
      .q {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .q button {
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--tile);
        color: var(--ink);
        cursor: pointer;
      }
      .cf {
        display: grid;
        gap: 0.5rem;
        margin-top: 0.8rem;
      }
      .cf .r {
        display: flex;
        justify-content: space-between;
      }
      .cf .tot {
        font: 700 1.2rem var(--head);
      }
      .err {
        color: var(--red);
        font-weight: 600;
        margin: 0;
      }
      .okm {
        color: var(--leaf);
        font-weight: 600;
        margin: 0;
      }
      #modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 30;
        display: none;
        place-items: center;
        padding: 1rem;
      }
      #modal.open {
        display: grid;
      }
      #mbox {
        background: var(--surface);
        border-radius: 18px;
        padding: 1.3rem;
        width: min(520px, 100%);
        max-height: 85vh;
        overflow: auto;
        border: 2px solid var(--ink);
      }
      .rv {
        border-bottom: 1px dashed var(--line);
        padding: 0.5rem 0;
      }
      footer {
        border-top: 1px solid var(--line);
        padding: 1.5rem 0 2rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site">
      <div class="wrap nav">
        <button class="logo" data-act="nav" data-id="shop">Mandi Market</button>
        <span id="tabs"></span>
        <select id="role" aria-label="Sign in as"></select>
        <button class="pill" data-act="notes">Alerts<b id="nc">0</b></button>
        <button class="pill" data-act="cart">Cart<b id="cc">0</b></button>
      </div>
    </header>
    <main class="wrap" id="main"></main>
    <footer>
      <div class="wrap">
        Mandi Market helps small vendors reach customers in their own
        neighbourhood. Switch the “Sign in as” menu to try the customer, vendor
        and admin views. Payments are simulated.
      </div>
    </footer>
    <aside class="drawer" id="drawer" aria-label="Shopping cart"></aside>
    <div id="modal" role="dialog" aria-modal="true"><div id="mbox"></div></div>
    <script>
      (function () {
        var K = "mandi_v1",
          S,
          R = "c",
          V = "shop",
          F = { q: "", cat: "", v: "", s: "" },
          CK = { addr: "", promo: "", pay: "upi", pd: "" },
          CM = "";
        var ST = ["Placed", "Packed", "Out for delivery", "Delivered"];
        function e(s) {
          return String(s).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }
        function $(i) {
          return document.getElementById(i);
        }
        function money(n) {
          return "₹" + Math.round(n).toLocaleString("en-IN");
        }
        function seed() {
          return {
            n: 100,
            cart: {},
            vendors: [
              {
                id: 1,
                name: "Gill Fresh Farms",
                emoji: "🥕",
                desc: "Vegetables, fruit and dairy from family fields.",
                status: "approved",
              },
              {
                id: 2,
                name: "Baker’s Nook",
                emoji: "🥐",
                desc: "Small-batch breads and cookies baked to order.",
                status: "approved",
              },
              {
                id: 3,
                name: "Rangeela Crafts",
                emoji: "🧶",
                desc: "Hand-embroidered phulkari, jutti and décor.",
                status: "approved",
              },
              {
                id: 4,
                name: "Sharma Masale",
                emoji: "🌶️",
                desc: "Stone-ground spices, pickles and dry fruit.",
                status: "approved",
              },
            ],
            products: [
              [
                1,
                1,
                "Desi tomatoes, 1 kg",
                44,
                50,
                30,
                "Fresh produce",
                "🍅",
                "tomato",
              ],
              [2, 2, "Multigrain loaf", 85, 0, 4, "Bakery", "🍞", "loaf"],
              [
                3,
                3,
                "Phulkari dupatta",
                1250,
                0,
                6,
                "Handicrafts",
                "🧵",
                "dupatta",
              ],
              [
                4,
                1,
                "Fresh paneer, 500 g",
                190,
                0,
                12,
                "Dairy",
                "🥛",
                "paneer",
              ],
              [
                5,
                4,
                "Jaggery (gur), 1 kg",
                110,
                130,
                25,
                "Spices",
                "🍯",
                "jaggery",
              ],
              [
                6,
                4,
                "Kashmiri chilli powder",
                95,
                0,
                7,
                "Spices",
                "🌶️",
                "chilli",
              ],
              [
                7,
                2,
                "Atta biscuits, box of 12",
                140,
                0,
                20,
                "Bakery",
                "🍪",
                "biscuit",
              ],
              [
                8,
                3,
                "Handmade punjabi jutti",
                799,
                0,
                9,
                "Handicrafts",
                "👡",
                "jutti",
              ],
              [
                9,
                1,
                "Jaggery (gur), 1 kg",
                120,
                0,
                10,
                "Spices",
                "🍯",
                "jaggery",
              ],
            ].map(function (a) {
              return {
                id: a[0],
                vid: a[1],
                name: a[2],
                price: a[3],
                old: a[4],
                stock: a[5],
                cat: a[6],
                emoji: a[7],
                g: a[8],
                status: "approved",
              };
            }),
            orders: [],
            reviews: [
              {
                id: 1,
                pid: 1,
                name: "Simran",
                rating: 5,
                text: "Fresh and tasty, delivered on time.",
                hidden: false,
              },
            ],
            promos: [{ code: "MANDI10", pct: 10, vid: 0 }],
            notes: [],
          };
        }
        function load() {
          try {
            S = JSON.parse(localStorage.getItem(K));
          } catch (x) {}
          if (!S || !S.vendors) S = seed();
        }
        function save() {
          try {
            localStorage.setItem(K, JSON.stringify(S));
          } catch (x) {}
        }
        function vend(id) {
          return S.vendors.filter(function (v) {
            return v.id === id;
          })[0];
        }
        function prod(id) {
          return S.products.filter(function (p) {
            return p.id === id;
          })[0];
        }
        function note(to, m) {
          S.notes.unshift({
            to: to,
            m: m,
            t: new Date().toLocaleString("en-IN"),
          });
          S.notes = S.notes.slice(0, 60);
        }
        function live(p) {
          var v = vend(p.vid);
          return p.status === "approved" && v && v.status === "approved";
        }
        function rate(pid) {
          var r = S.reviews.filter(function (x) {
            return x.pid === pid && !x.hidden;
          });
          var t = r.reduce(function (a, b) {
            return a + b.rating;
          }, 0);
          return { n: r.length, a: r.length ? (t / r.length).toFixed(1) : 0 };
        }
        function best(p) {
          var g = S.products.filter(function (x) {
            return x.g === p.g && live(x) && x.stock;
          });
          return (
            g.length > 1 &&
            p.stock &&
            p.price ===
              Math.min.apply(
                0,
                g.map(function (x) {
                  return x.price;
                }),
              )
          );
        }
        function myV() {
          return R[0] === "v" ? vend(+R.slice(1)) : null;
        }

        /* chrome */
        function chrome() {
          var o = '<option value="c">Customer</option>',
            i;
          S.vendors.forEach(function (v) {
            o +=
              '<option value="v' +
              v.id +
              '">Vendor: ' +
              e(v.name) +
              (v.status === "pending" ? " (pending)" : "") +
              "</option>";
          });
          o +=
            '<option value="a">Admin</option><option value="new">+ Register a store…</option>';
          $("role").innerHTML = o;
          $("role").value = R;
          var t =
            '<button class="tab' +
            (V === "shop" ? " on" : "") +
            '" data-act="nav" data-id="shop">Shop</button> ';
          if (R === "c")
            t +=
              '<button class="tab' +
              (V === "orders" ? " on" : "") +
              '" data-act="nav" data-id="orders">My orders</button>';
          if (R[0] === "v")
            t +=
              '<button class="tab' +
              (V === "vendor" ? " on" : "") +
              '" data-act="nav" data-id="vendor">My store</button>';
          if (R === "a")
            t +=
              '<button class="tab' +
              (V === "admin" ? " on" : "") +
              '" data-act="nav" data-id="admin">Admin</button>';
          $("tabs").innerHTML = t;
          var to = R === "c" ? "c" : R === "a" ? "a" : R;
          $("nc").textContent = S.notes.filter(function (n) {
            return n.to === to;
          }).length;
          $("cc").textContent = Object.keys(S.cart).reduce(function (a, k) {
            return a + S.cart[k];
          }, 0);
        }
        function go(v) {
          V = v;
          render();
        }
        function render() {
          if (V === "orders" && R !== "c") V = "shop";
          if (V === "vendor" && R[0] !== "v") V = "shop";
          if (V === "admin" && R !== "a") V = "shop";
          chrome();
          $("main").innerHTML =
            V === "shop"
              ? shop()
              : V === "orders"
                ? orders()
                : V === "vendor"
                  ? vendorV()
                  : admin();
          if (V === "shop") grid();
          if ($("drawer").classList.contains("open")) cartR();
        }

        /* shop */
        function shop() {
          var cats = [],
            h = "";
          S.products.forEach(function (p) {
            if (live(p) && cats.indexOf(p.cat) < 0) cats.push(p.cat);
          });
          var vs = S.vendors.filter(function (v) {
            return v.status === "approved";
          });
          h +=
            '<div class="hero"><h1>Your neighbourhood market, open all day online.</h1><p>Buy fresh produce, sweets, crafts and household goods straight from small vendors near you.</p></div>';
          h +=
            '<div class="filters"><input id="fq" type="search" placeholder="Search for atta, jaggery, phulkari…" aria-label="Search products" value="' +
            e(F.q) +
            '">';
          h +=
            '<select id="fc" aria-label="Category"><option value="">All categories</option>' +
            cats
              .map(function (c) {
                return (
                  "<option" +
                  (F.cat === c ? " selected" : "") +
                  ">" +
                  e(c) +
                  "</option>"
                );
              })
              .join("") +
            "</select>";
          h +=
            '<select id="fv" aria-label="Vendor"><option value="">All vendors</option>' +
            vs
              .map(function (v) {
                return (
                  '<option value="' +
                  v.id +
                  '"' +
                  (F.v == v.id ? " selected" : "") +
                  ">" +
                  e(v.name) +
                  "</option>"
                );
              })
              .join("") +
            "</select>";
          h +=
            '<select id="fs" aria-label="Sort"><option value="">Sort: featured</option><option value="lo"' +
            (F.s === "lo" ? " selected" : "") +
            '>Price: low to high</option><option value="hi"' +
            (F.s === "hi" ? " selected" : "") +
            '>Price: high to low</option><option value="rt"' +
            (F.s === "rt" ? " selected" : "") +
            ">Top rated</option></select></div>";
          h +=
            '<section style="padding-top:0"><h2 class="t">Fresh from local shelves</h2><div class="grid products" id="grid"></div></section>';
          h +=
            '<section><h2 class="t">Meet the vendors</h2><div class="grid vendors">' +
            vs
              .map(function (v) {
                var n = S.products.filter(function (p) {
                  return p.vid === v.id && live(p);
                }).length;
                return (
                  '<article class="card vendor"><div class="top"><span class="avatar">' +
                  e(v.emoji) +
                  "</span><div><h3>" +
                  e(v.name) +
                  '</h3><span class="meta">' +
                  n +
                  ' products</span></div></div><p class="meta">' +
                  e(v.desc) +
                  '</p><button class="btn alt sm" data-act="fv" data-id="' +
                  v.id +
                  '">Shop this vendor</button></article>'
                );
              })
              .join("") +
            "</div></section>";
          return h;
        }
        function grid() {
          var q = F.q.toLowerCase(),
            l = S.products.filter(function (p) {
              return (
                live(p) &&
                (!q ||
                  (p.name + " " + vend(p.vid).name + " " + p.cat)
                    .toLowerCase()
                    .indexOf(q) > -1) &&
                (!F.cat || p.cat === F.cat) &&
                (!F.v || p.vid == F.v)
              );
            });
          if (F.s === "lo")
            l.sort(function (a, b) {
              return a.price - b.price;
            });
          if (F.s === "hi")
            l.sort(function (a, b) {
              return b.price - a.price;
            });
          if (F.s === "rt")
            l.sort(function (a, b) {
              return rate(b.id).a - rate(a.id).a;
            });
          $("grid").innerHTML = l.length
            ? l.map(pcard).join("")
            : '<p class="empty">No products match. Try a different search or filter.</p>';
        }
        function pcard(p) {
          var r = rate(p.id);
          return (
            '<article class="card"><div class="pimg">' +
            e(p.emoji) +
            '</div><div class="pbody"><div>' +
            (p.old > p.price
              ? '<span class="badge">' +
                Math.round(100 - (p.price / p.old) * 100) +
                "% off</span>"
              : "") +
            (best(p)
              ? '<span class="badge" style="background:var(--leaf)">Best price</span>'
              : "") +
            "</div><h3>" +
            e(p.name) +
            '</h3><span class="meta">' +
            e(vend(p.vid).name) +
            (r.n ? " · ★ " + r.a + " (" + r.n + ")" : "") +
            '</span><div class="price">' +
            money(p.price) +
            (p.old > p.price ? "<s>" + money(p.old) + "</s>" : "") +
            '</div><span class="stock' +
            (p.stock <= 5 ? " low" : "") +
            '">' +
            (p.stock
              ? p.stock > 5
                ? "In stock"
                : "Only " + p.stock + " left"
              : "Sold out") +
            '</span><div class="row2"><button class="btn" data-act="add" data-id="' +
            p.id +
            '"' +
            (p.stock ? "" : " disabled") +
            '>Add to cart</button><button class="btn alt" data-act="rev" data-id="' +
            p.id +
            '">Reviews</button></div></div></article>'
          );
        }

        /* cart */
        function totals() {
          var sub = 0,
            disc = 0,
            p = null,
            m = "";
          var pr = S.promos.filter(function (x) {
            return x.code === CK.promo.trim().toUpperCase();
          })[0];
          Object.keys(S.cart).forEach(function (id) {
            var it = prod(+id);
            if (!it) return;
            var a = it.price * S.cart[id];
            sub += a;
            if (pr && (!pr.vid || pr.vid === it.vid))
              disc += (a * pr.pct) / 100;
          });
          if (CK.promo.trim() && !pr) m = "That code is not valid.";
          else if (pr && !disc)
            m = "That code does not apply to the items in your cart.";
          else if (pr) m = "Code applied: " + pr.pct + "% off.";
          var ship = sub && sub - disc < 499 ? 40 : 0;
          return {
            sub: sub,
            disc: disc,
            ship: ship,
            total: sub - disc + ship,
            pm: m,
            ok: !!(pr && disc),
          };
        }
        function cartR() {
          var ids = Object.keys(S.cart).filter(function (i) {
              return prod(+i);
            }),
            t = totals();
          var h =
            '<header><h2>Your cart</h2><button class="btn alt sm" data-act="close">Close</button></header><ul>';
          h += ids.length
            ? ids
                .map(function (i) {
                  var p = prod(+i);
                  return (
                    "<li><div><strong>" +
                    e(p.name) +
                    '</strong><br><small class="meta">' +
                    e(vend(p.vid).name) +
                    " · " +
                    money(p.price) +
                    '</small></div><div class="q" data-id="' +
                    i +
                    '"><button data-act="dec" aria-label="Decrease">−</button><span>' +
                    S.cart[i] +
                    '</span><button data-act="inc" aria-label="Increase">+</button></div></li>'
                  );
                })
                .join("")
            : '<li><div class="empty">Your cart is empty. Add a product to get started.</div></li>';
          h +=
            '</ul><div class="cf"><input id="ck-p" placeholder="Promo code (try MANDI10)" value="' +
            e(CK.promo) +
            '">' +
            (t.pm
              ? '<p class="' + (t.ok ? "okm" : "err") + '">' + t.pm + "</p>"
              : "");
          h +=
            '<textarea id="ck-a" rows="2" placeholder="Delivery address">' +
            e(CK.addr) +
            "</textarea>";
          h +=
            '<select id="ck-m"><option value="upi"' +
            (CK.pay === "upi" ? " selected" : "") +
            '>UPI</option><option value="card"' +
            (CK.pay === "card" ? " selected" : "") +
            '>Debit / credit card</option><option value="cod"' +
            (CK.pay === "cod" ? " selected" : "") +
            ">Pay on delivery</option></select>";
          if (CK.pay !== "cod")
            h +=
              '<input id="ck-d" placeholder="' +
              (CK.pay === "upi"
                ? "UPI ID, e.g. name@upi"
                : "16-digit card number") +
              '" value="' +
              e(CK.pd) +
              '" inputmode="' +
              (CK.pay === "upi" ? "text" : "numeric") +
              '">';
          h +=
            '<div class="r"><span>Subtotal</span><span>' +
            money(t.sub) +
            '</span></div><div class="r"><span>Discount</span><span>−' +
            money(t.disc) +
            '</span></div><div class="r"><span>Delivery</span><span>' +
            (t.ship ? money(t.ship) : "Free") +
            '</span></div><div class="r tot"><span>Total</span><span>' +
            money(t.total) +
            "</span></div>";
          h +=
            '<button class="btn" data-act="order"' +
            (ids.length ? "" : " disabled") +
            ">" +
            (CK.pay === "cod"
              ? "Place order"
              : "Pay " + money(t.total) + " and order") +
            "</button>" +
            (CM
              ? '<p class="' +
                (CM[0] === "!" ? "err" : "okm") +
                '" role="status">' +
                e(CM.replace(/^!/, "")) +
                "</p>"
              : "") +
            "</div>";
          $("drawer").innerHTML = h;
        }
        function order() {
          var ids = Object.keys(S.cart).filter(function (i) {
              return prod(+i);
            }),
            t = totals();
          if (R !== "c") {
            CM = "!Switch to the Customer view to place an order.";
            return cartR();
          }
          if (!ids.length) return;
          if (CK.addr.trim().length < 8) {
            CM = "!Enter a delivery address of at least 8 characters.";
            return cartR();
          }
          if (
            CK.pay === "upi" &&
            !/^[\w.\-]{2,}@[\w]{2,}$/.test(CK.pd.trim())
          ) {
            CM = "!Enter a valid UPI ID like name@upi.";
            return cartR();
          }
          if (CK.pay === "card" && !/^\d{16}$/.test(CK.pd.replace(/\s/g, ""))) {
            CM = "!Enter a 16-digit card number.";
            return cartR();
          }
          for (var i = 0; i < ids.length; i++) {
            var p = prod(+ids[i]);
            if (S.cart[ids[i]] > p.stock) {
              CM =
                "!" +
                p.name +
                " has only " +
                p.stock +
                " left. Reduce the quantity.";
              return cartR();
            }
          }
          var items = [],
            vids = [];
          ids.forEach(function (i) {
            var p = prod(+i),
              q = S.cart[i];
            p.stock -= q;
            items.push({
              pid: p.id,
              name: p.name,
              vid: p.vid,
              price: p.price,
              qty: q,
            });
            if (vids.indexOf(p.vid) < 0) vids.push(p.vid);
            if (p.stock <= 5)
              note(
                "v" + p.vid,
                p.name + " is low on stock (" + p.stock + " left).",
              );
          });
          var o = {
            id: S.n++,
            items: items,
            total: t.total,
            disc: t.disc,
            status: "Placed",
            pay:
              CK.pay === "cod"
                ? "Pay on delivery"
                : "Paid by " + (CK.pay === "upi" ? "UPI" : "card"),
            addr: CK.addr.trim(),
            time: new Date().toLocaleString("en-IN"),
          };
          S.orders.unshift(o);
          vids.forEach(function (v) {
            note("v" + v, "New order #" + o.id + " to pack.");
          });
          note("a", "Order #" + o.id + " placed: " + money(o.total) + ".");
          note(
            "c",
            "Order #" +
              o.id +
              " placed. " +
              (CK.pay === "cod" ? "Pay on delivery." : "Payment received."),
          );
          S.cart = {};
          CK.promo = "";
          CK.pd = "";
          CM = "Order #" + o.id + " placed. The vendors have been notified.";
          save();
          render();
        }

        /* customer orders */
        function track(o) {
          if (o.status === "Cancelled")
            return '<span class="tagst no">Cancelled</span>';
          var k = ST.indexOf(o.status);
          return (
            '<div class="track">' +
            ST.map(function (s, i) {
              return (
                "<span" + (i <= k ? ' class="d"' : "") + ">" + s + "</span>"
              );
            }).join("") +
            "</div>"
          );
        }
        function orders() {
          var h = '<section><h2 class="t">My orders</h2>';
          h += S.orders.length
            ? S.orders
                .map(function (o) {
                  return (
                    '<div class="panel"><h3>Order #' +
                    o.id +
                    " · " +
                    money(o.total) +
                    '</h3><p class="meta">' +
                    e(o.time) +
                    " · " +
                    e(o.pay) +
                    "<br>" +
                    o.items
                      .map(function (i) {
                        return e(i.name) + " ×" + i.qty;
                      })
                      .join(", ") +
                    "<br>To: " +
                    e(o.addr) +
                    "</p>" +
                    track(o) +
                    (o.status === "Placed"
                      ? '<button class="btn alt sm" data-act="cancel" data-id="' +
                        o.id +
                        '">Cancel order</button> '
                      : "") +
                    (o.status === "Delivered"
                      ? o.items
                          .map(function (i) {

                              i.pid +
                              '">Review ' +
                              e(i.name) +
                              "</button> "
                            );
                          })
                          .join("")
                      : "") +
                    "</div>"
                  );
                })
                .join("")
            : '<p class="empty">No orders yet. Add something from the shop to place your first order.</p>';
          return h + "</section>";
        }
        function advance(id) {
          var o = S.orders.filter(function (x) {
              return x.id == id;
            })[0],
            k = ST.indexOf(o.status);
          if (k < 0 || k > 2) return;
          o.status = ST[k + 1];
          if (o.status === "Delivered" && o.pay === "Pay on delivery")
            o.pay = "Paid in cash";
          note("c", "Order #" + o.id + " is now: " + o.status + ".");
          note("a", "Order #" + o.id + " → " + o.status + ".");
        }
        function cancel(id) {
          var o = S.orders.filter(function (x) {
            return x.id == id;
          })[0];
          if (!o || o.status !== "Placed") return;
          o.status = "Cancelled";
          o.items.forEach(function (i) {
            var p = prod(i.pid);
            if (p) p.stock += i.qty;
          });
          note("c", "Order #" + o.id + " was cancelled and stock restored.");
          note("a", "Order #" + o.id + " cancelled.");
          note("v" + o.items[0].vid, "Order #" + o.id + " was cancelled.");
        }

        /* vendor */

          var mp = S.products.filter(function (p) {

          h +=
            '<div class="panel"><h3>Add a product</h3><form data-form="prod" class="frm"><label>Name<input name="n" required></label><label>Price (₹)<input name="p" type="number" min="1" required></label><label>Old price (optional)<input name="o" type="number" min="0"></label><label>Stock<input name="s" type="number" min="0" required></label><label>Category<input name="c" required placeholder="Dairy"></label><label>Emoji<input name="e" value="🛒" maxlength="4"></label><button class="btn">Add product</button></form><p class="meta">New products wait for admin approval.</p></div>';
          h +=

                    );
                  })
                  .join("")
              : '<tr><td colspan="5" class="empty">No products yet. Add your first one above.</td></tr>') +
            "</table></div></div>";
          h +=
            '<div class="panel"><h3>Orders</h3>' +
            (mo.length
              ? mo
                  .map(function (o) {
                    var k = ST.indexOf(o.status);
                    return (
                      '<div class="rv"><strong>#' +
                      o.id +
                      "</strong> · " +
                      e(o.status) +
                      " · " +
                      e(o.pay) +
                      '<br><span class="meta">' +
                      o.items
                        .filter(function (i) {
                          return i.vid === v.id;
                        })
                        .map(function (i) {

                        .join(", ") +
                      " · " +
                      e(o.addr) +

              ? '<form data-form="rev" data-id="' +
                id +
                '" class="cf"><input name="n" placeholder="Your name" required><select name="r"><option value="5">★★★★★ Excellent</option><option value="4">★★★★ Good</option><option value="3">★★★ Okay</option><option value="2">★★ Poor</option><option value="1">★ Bad</option></select><textarea name="t" rows="2" placeholder="Share your experience" required></textarea><button class="btn">Post review</button></form>'
              : '<p class="meta">Switch to the Customer view to write a review.</p>';
          h +=
            '<p><button class="btn alt sm" data-act="mclose">Close</button></p>';
          modal(h);
        }
        function notesM() {
          var to = R,
            l = S.notes.filter(function (n) {
              return n.to === to;
            });
          modal(
            "<h3>Alerts</h3>" +
              (l.length
                ? l
                    .map(function (n) {
                      return (
                        '<div class="rv">' +
                        e(n.m) +
                        '<br><small class="meta">' +
                        e(n.t) +
                        "</small></div>"
                      );
                    })
                    .join("")
                : '<p class="empty">No alerts for this account yet.</p>') +
              "<p>" +
              (l.length
                ? '<button class="btn sm" data-act="nclear">Clear all</button> '
                : "") +
              '<button class="btn alt sm" data-act="mclose">Close</button></p>',
          );
        }
        function regM() {
          modal(
            '<h3>Register your store</h3><form data-form="reg" class="cf"><input name="n" placeholder="Store name" required><input name="e" placeholder="Emoji for your store" value="🏪" maxlength="4"><textarea name="d" rows="2" placeholder="What do you sell?" required></textarea><button class="btn">Register store</button></form><p><button class="btn alt sm" data-act="mclose">Cancel</button></p>',
          );
        }

        /* events */
        document.addEventListener("click", function (ev) {
          var b = ev.target.closest("[data-act]");
          if (!b) return;
          var a = b.getAttribute("data-act"),
            id = b.getAttribute("data-id");
          if (a === "nav") go(id);
          else if (a === "cart") {
            CM = "";
            cartR();
            $("drawer").classList.add("open");
          } else if (a === "close") $("drawer").classList.remove("open");
          else if (a === "notes") notesM();
          else if (a === "mclose") closeM();
          else if (a === "nclear") {
            S.notes = S.notes.filter(function (n) {
              return n.to !== R;
            });
            save();
            closeM();
            render();
          } else if (a === "add") {
            var p = prod(+id),
              q = (S.cart[id] || 0) + 1;
            if (q > p.stock) return;
            S.cart[id] = q;
            save();
            chrome();
            b.textContent = "Added";
            setTimeout(function () {
              b.textContent = "Add to cart";
            }, 900);
            if ($("drawer").classList.contains("open")) cartR();
          } else if (a === "inc" || a === "dec") {
            var i = b.parentNode.getAttribute("data-id"),
              p2 = prod(+i),
              n = S.cart[i] + (a === "inc" ? 1 : -1);
            if (n > p2.stock) n = p2.stock;
            if (n < 1) delete S.cart[i];
            else S.cart[i] = n;
            save();
            chrome();
            cartR();
          } else if (a === "order") order();
          else if (a === "fv") {
            F.v = id;
            render();
            window.scrollTo(0, 0);
          } else if (a === "rev") revM(+id);
          else if (a === "cancel") {
            cancel(id);
            save();
            render();
          } else if (a === "adv") {
            advance(id);
            save();
            render();
          } else if (a === "psave") {
            var tr = b.closest("tr"),
              p3 = prod(+id),
              pr = +tr.querySelector("[data-f=price]").value,
              st = +tr.querySelector("[data-f=stock]").value;
            if (pr > 0 && st >= 0) {
              p3.price = pr;
              p3.stock = st;
              save();
              render();
            }
          } else if (a === "pdel") {
            S.products = S.products.filter(function (x) {
              return x.id !== +id;
            });
            delete S.cart[id];
            save();
            render();
          } else if (a === "prdel") {
            S.promos = S.promos.filter(function (x) {
              return x.code !== id;
            });
            save();
            render();
          } else if (a === "vok") {
            var v = vend(+id);
            v.status = "approved";
            note(
              "v" + v.id,
              "Your store was approved. You can list products now.",
            );
            save();
            render();
          } else if (a === "pok") {
            var p4 = prod(+id);
            p4.status = "approved";
            note("v" + p4.vid, p4.name + " is now live.");
            save();
            render();
          } else if (a === "rhide") {
            var r = S.reviews.filter(function (x) {
              return x.id === +id;
            })[0];
            r.hidden = !r.hidden;
            save();
            render();
          }
        });
        document.addEventListener("submit", function (ev) {
          var f = ev.target,
            k = f.getAttribute("data-form");
          if (!k) return;
          ev.preventDefault();
          var d = function (n) {
              return f.elements[n].value.trim();
            },
            v = myV();
          if (k === "prod") {
            S.products.push({
              id: S.n++,
              vid: v.id,
              name: d("n"),
              price: +d("p"),
              old: +d("o") || 0,
              stock: +d("s"),
              cat: d("c"),
              emoji: d("e") || "🛒",
              g: d("n").toLowerCase(),
              status: "pending",
            });
            note(
              "a",
              "New product from " + v.name + ": " + d("n") + " needs approval.",
            );
          } else if (k === "promo") {
            var c = d("c").toUpperCase();
            if (
              S.promos.some(function (x) {
                return x.code === c;
              })
            ) {
              alert("That code already exists.");
              return;
            }
            S.promos.push({ code: c, pct: +d("d"), vid: v.id });
          } else if (k === "rev") {
            S.reviews.push({
              id: S.n++,
              pid: +f.getAttribute("data-id"),
              name: d("n"),
              rating: +d("r"),
              text: d("t"),
              hidden: false,
            });
            note("a", "New review posted.");
            save();
            render();
            return revM(+f.getAttribute("data-id"));
          } else if (k === "reg") {
            var nv = {
              id: S.n++,
              name: d("n"),
              emoji: d("e") || "🏪",
              desc: d("d"),
              status: "pending",
            };
            S.vendors.push(nv);
            note("a", "New store “" + nv.name + "” needs approval.");
            R = "v" + nv.id;
            V = "vendor";
            closeM();
          }
          save();
          render();
        });
        document.addEventListener("input", function (ev) {
          var t = ev.target,
            i = t.id;
          if (i === "fq") {
            F.q = t.value;
            grid();
          } else if (i === "ck-p") {
            CK.promo = t.value;
          } else if (i === "ck-a") {
            CK.addr = t.value;
          } else if (i === "ck-d") {
            CK.pd = t.value;
          }
        });
        document.addEventListener("change", function (ev) {
          var t = ev.target,
            i = t.id;
          if (i === "fc") {
            F.cat = t.value;
            grid();
          } else if (i === "fv") {
            F.v = t.value;
            grid();
          } else if (i === "fs") {
            F.s = t.value;
            grid();
          } else if (i === "ck-m") {
            CK.pay = t.value;
            CK.pd = "";
            cartR();
          } else if (i === "ck-p") {
            cartR();
          } else if (i === "role") {
            if (t.value === "new") {
              t.value = R;
              return regM();
            }
            R = t.value;
            V = R[0] === "v" ? "vendor" : R === "a" ? "admin" : "shop";
            $("drawer").classList.remove("open");
            render();
          }
        });
        document.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape") {
            closeM();
            $("drawer").classList.remove("open");
          }
        });
        $("modal").addEventListener("click", function (ev) {
          if (ev.target === this) closeM();
        });
        load();
        render();
      })();
    </script>
  </body>
</html>
